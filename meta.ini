nexusDescription="[b][size=4][color=#ff0000]NOTE:[/color]\n<br />[/size][/b][i]Time Flies v2 is a port of the mod of the same name from Skyrim Legendary Edition. The authors,\xa0\x64\x66xyz1 and Akezhar,  have graciously given permission to upload and port the mod to Special Edition. Kudos and thanks should go to dfxyz1 and Akezhar they are the original mod creators.The following description for v2 is copied from the original mod page and has been updated for v3 and above. I am now managing the mod should any issues or feature requests arise. \n<br />- Wolfpack49\n<br />[/i]\n<br />[b][size=4]Description[/size][/b]\n<br />If you use basic needs mod like RND or iNeed to enhance your gameplay, you may want a mod to make time pass when you perform actions like crafting, reading, eating etc. Then this might be the mod you're looking for. Also, feel free to modify the source and add support for your favorite mods, or redistribute your modified version, no permission needed!\n<br />\n<br />[b][size=4]Features[/size][/b]\n<br />[list]\n<br />[*]Make game time pass when crafting, reading, looting, lockpicking, trading, eating, training and learning spells - all configurable in the MCM.\n<br />[*]Crafting different items takes different amount of time. Crafting takes an exact time or a random value within a range.\n<br />[*]Reading increases speech skill based on time spent reading.\n<br />[*]Hotkey to pause time passing function in special situations.\n<br />[/list]\n<br />[b][size=4]Recommendations[/size][/b]\n<br />[list]\n<br />[*]Set timescale to 10 for more immersive experience. [url=https://www.nexusmods.com/skyrimspecialedition/mods/18922]Dynamic Timescale[/url]\xfeff is recommended for location-based timescale\n<br />[*]Use time widget mods like [url=https://www.nexusmods.com/skyrimspecialedition/mods/12937/]A Matter of Time[/url].\n<br />[*]Combine with [url=https://www.nexusmods.com/skyrimspecialedition/mods/27859]Skyrim Souls[/url]\xfeff for a mix of unfrozen time for some menus (see the sticky in the Posts section)\n<br />[*]Use [url=https://www.nexusmods.com/skyrimspecialedition/mods/1503]Fast Travel Speed Fix[/url]\xfeff for more realistic travel times when fast traveling\n<br />[*]Combine with [url=https://www.nexusmods.com/skyrimspecialedition/mods/62861]Seasons of Skyrim[/url]\xfeff and [url=https://www.nexusmods.com/skyrimspecialedition/mods/63623]Turn of the Seasons[/url]\xfeff to experience each season of the year\n<br />[/list]\n<br />[b][size=4]Differences from Living Takes Time[/size][/b]\n<br />Like I said, this is a modified version of Living Takes Time. I removed some parts, added some new things and did refactoring with the others.\n<br />Here is a list of differences from Living Takes Time:\n<br />\n<br />[i]\"Expertise reduces time\" replaced by \"Random crafting time\" (NOTE: 'Experience reduces time' was restored as an option in v7)[/i]\n<br />[list]\n<br />[*]Life is more interesting with all the variables.\n<br />[*]Some items may belong to the same category, that doesn't mean it takes the same time crafting them.\n<br />[*]When crafting, the time you spent may varies from x% to y% of the value you set (by default that's 67% to 100%).\n<br />[/list]\n<br />[i]\"Block x while in combat\" removed. (NOTE: Menu and object blocking added as an option in v7)[/i]\n<br />It's a hardcore option and I may like it if there's a real way to block opening those menus instead of closing them after opening.\n<br />\n<br />[i]\"Crafting takes time\" improved[/i]\n<br />[list]\n<br />[*]Clothes and armors crafting time can be configured separately now.\n<br />[*]Tanning and smelting time can be configured separately now.\n<br />[*]Alchemy and cooking time can be configured separately now.\n<br />[*]\"Misc\" items should be ignored in most situations for better compatibility[i] (NOTE: Tools and clutter added to crafting time in v7)[/i]\n<br />[*]Also, something like cutting leather into strips doesn't take \"considerable\" time.\n<br />[/list]\n<br />[i]\"Hearthfire takes time\" added.[/i]\n<br />Rome wasn't built in a day. Neither will your mansion.\n<br />\n<br />[i]\"Level Up takes time\", \"Preparing takes time\" removed.[/i]\n<br />I think those menus should be considered time-pausing elements.\n<br />\n<br />[i]Some multipliers merged.[/i]\n<br />[list]\n<br />[*]Looting time multiplier and pickpocket time multiplier merged.\n<br />[*]Barter time multiplier and gifting time multiplier merged.\n<br />[/list]\n<br />[size=4][b]Regarding the Anniversary Edition of Skyrim (AE)[/b][/size]\n<br />Now that [url=https://skse.silverlock.org/]SKSE64[/url] is working with AE (be sure to install the \"Current Aniversary Edition build\" with Skyrim 1.6.x), Time Flies should work pretty well with the new edition of the game.\xa0 Please report any issues!\n<br />\n<br />[b][size=4]What's New in version 8[/size][/b]\n<br />Time Flies 8 is now live. Please follow the Update instructions below and reinitialize if updating From Time Flies 7 mid-game.\n<br />[list]\n<br />[*]Added support for [url=https://www.nexusmods.com/skyrimspecialedition/mods/17581]Wounds[/url]\xfeff, [url=https://www.nexusmods.com/skyrimspecialedition/mods/52984]Shovels Bury Bodies[/url]\xfeff, [url=https://www.nexusmods.com/skyrimspecialedition/mods/54099]Pilgrim[/url]\xfeff and [url=https://www.nexusmods.com/skyrimspecialedition/mods/22506]Wintersun[/url]\xfeff. Requires full reinitialization following the update process in the Description.\n<br />[*]Added option to apply fishing time when catching junk with AE Fishing. Off by default.\n<br />[*]Expertise and Random time multipliers extended to all supported mods\n<br />[/list]\n<br />[size=4][b]What's New in version 7[/b][/size]\n<br />[spoiler]\n<br />[list]\n<br />[*]Adds (optional) modifier to weapon, armor and ammo crafting time based on item value. Iron and Daedric used for lower/upper baselines.\n<br />[*]Adds Tool &amp; Clutter crafting time\n<br />[*]Transitions effect expanded to Alchemy, Cooking, Crafting, Skinning, Spell Learning and Training when time exceeds the set threshold.\n<br />[*]Adds (optional) menu and object blocking in combat. Press and hold the Q, 1-8 or E keys to override the block for the Favorites menu, mapped hotkeys and horse dismount.\xa0\n<br />[*]Adds notifications for vanilla and mod-added time skips using the set notification threshold.\n<br />[*]MCM Update[i]s[/i]\n<br />[/list][/spoiler]\n<br />\n<br />[size=4][b]What's New in version 6\n<br />[/b][/size][spoiler][list]\n<br />[*]Added support for Anniversary Edition fishing (requires Skyrim 1.6.x)\n<br />[*]Added support for [url=https://www.nexusmods.com/skyrimspecialedition/mods/22353]Campsite[/url]\xfeff\n<br />[*]Added compatibility with [url=https://www.nexusmods.com/skyrimspecialedition/mods/20983]Spell Research[/url]\xfeff. Each Solution type created now passes alchemy time from the Cauldron and Alembic.\n<br />[*]Added compatibility with [url=https://www.nexusmods.com/skyrimspecialedition/mods/67801]Simple Cow and Goat Milking[/url]\xfeff and [url=https://www.nexusmods.com/skyrimspecialedition/mods/67776]Actually Useful Butter Churns.[/url]\xfeff\n<br />[*]Inventory now passes looting time on close of menu (menu open time determines game time passed). Added MCM toggle for looting inventory multiplier.\n<br />[*]Cooking time now passes once on Crafting menu close for the total number of items cooked\n<br />[*]Alchemy time now passes once on leaving Crafting menu for total number of potions and poisons crafted.\n<br />[*]Menu open time now only passes game time when out of combat\n<br />[*]Added (optional) Scaled Training Time. Reduced time for training skills below 25, and increased time for training skills above 25. 1% \n<br />Increments.[*]Restored (optional) Expertise Reduces Crafting Time from Living Takes Time (functionality is identical)\n<br />[*]Improved eating/drinking from outside the inventory menu (hotkey, inn meals etc.)\n<br />[*]Added optional Days Elapsed notification on game load\n<br />[/list]Also, if you haven't been to the page in awhile, be sure to check out the changes that went in for Skinning in 5.3.x below. Let me know of any issues or feedback! Oh, and if you haven't done so already, check out [url=https://www.nexusmods.com/skyrimspecialedition/mods/62861]Seasons of Skyrim SKSE[/url] and [url=https://www.nexusmods.com/skyrimspecialedition/mods/63623/]Turn of the Seasons[/url] and give those mods and powerofthree/TateTaylor the amazing kudos they deserve.\xa0 Both mods are a huge addition to the game, and coincidentally pair incredibly well with Time Flies if you want to see all 4 seasons during a playthru.[/spoiler][i]\n<br />\n<br />[/i][size=4][b]What's new in version 5[/b][/size][size=4][b]\n<br />[/b][/size][spoiler]5.3.x While Skinning worked for the majority of cases, if you happened to loot a character race (e.g. a bandit or hunter), or certain creature races (e.g. Riekling/Falmer hunters) for animal parts or ingredients in their possession but not part of their own bodies (wolf hides or boar meat for example), Skinning/Harvesting time would pass incorrectly.\xa0The workaround was to use the Time Flies pause feature when looting those types of opponents. \n<br />\n<br />In 5.3.0, Skinning time will instead trigger based on [b][i]types of items[/i][/b] looted: \n<br />\n<br />Looting [b][i]only [/i][/b]animal parts or ingredients from a fallen foe (be it animal, creature or character race), will pass Skinning/Harvesting time.\xa0 However, looting [b][i]at least one[/i][/b] non-animal part/ingredient along with those items will pass regular looting time. \xa0\n<br />\n<br />While this is not a perfect solution (Skinning time could still pass when looting only animal hides from a character race, and regular looting time could pass if a Wolf has an Amethyst, and it is looted together with the hide), I do believe this approach is more immersive and gives the player more control over the type of time that passes. Please let me know if you spot any issues.5.0.x\n<br />\n<br />[list]\n<br />[*]New mod support for [url=https://www.nexusmods.com/skyrimspecialedition/mods/56393]Last Seed[/url] and [url=https://www.nexusmods.com/skyrimspecialedition/mods/8450]Hearthfire Extended[/url]\n<br />[*]Crafting waterskins and rain barrels, distilling salt, and purifying dirty water.\n<br />[*]Crafting for butter, brewing as well as new items added by Hearthfire Extended\n<br />[*]Added ability to craft from non-workstation furniture (butter churn, brewer, CACO retort)\n<br />[*]Honed Metal now uses set trading time\n<br />[*]Lumbering (aka wood chopping)\n<br />[*]Cow milking! :)\n<br />[/list][/spoiler][i]\n<br />[size=4][b]\n<br />[/b][/size][/i][size=4][b]What's new in version 4\n<br />[/b][/size][spoiler][list]\n<br />[*]New mod support for [url=https://www.nexusmods.com/skyrimspecialedition/mods/39414]SunHelm[/url], [url=https://www.nexusmods.com/skyrimspecialedition/mods/17774]Skyrim Fishing[/url], [url=https://www.nexusmods.com/skyrimspecialedition/mods/10353]Hunting in Skyrim[/url], [url=https://www.nexusmods.com/skyrimspecialedition/mods/17492]Basic Camp Gear[/url]\n<br />[*]Updates to mod detection and initialization\n<br />[*]Crafting for waterskins, distilling salt water, fishing poles, traps, trap repair kits, arrow crafting kits and mortar &amp; pestle, tents, camp/cookfire, bedrolls, rug\n<br />[*]New timed activity: [i]Fishing[/i]. Set a standard time per fishing attempt, but TF also allows for wide variability in the time that passes for each fishing round by adding the option to set min/max multipliers, and then generating a random multiplier within that range.\xa0 Default fishing time is 30m, default minimum is x0.1 of set time, and default maximum is x1.5 of set time.\n<br />[*]Added timer for Campfire and Basic Camp Gear tent pitching\n<br />[*]Mods that initiate crafting via spell (Hunterborn [i]Scrimshaw[/i], [i]Primitive Cooking[/i], Campfire [i]Create Item[/i]) now use standard crafting times for most item types)\n<br />[*]Added optional fullscreen transitions\n<br />[*]MCM cleanup and enhancements\n<br />[/list][/spoiler]\n<br />\n<br />[b][size=4]What's new in version 3\n<br />[/size][/b][spoiler]Complete Alchemy and Cooking Overhaul (CACO) compatibility has been added and overall compatibility with other mods is improved.\xa0 iNeed Waterskins no longer advance time at cookpots, only at the tanning rack. Time for alchemy no longer triggers twice when CACO is installed.\n<br />\n<br />Building &amp; Replenishing Campfire times now occur separately when using the Campfire Quick mode, and defaults are now set to 15m. Fires started with magic take no time.\xa0 The MCM setting has been moved to the Campfire tab.\xa0 If you aren't using the Quick mode for firebuilding, the setting in Time Flies will have no effect.\n<br />\n<br />Time Flies now relies on the crafting workstation to detect whether most crafting is occurring.\xa0 If crafting occurs without using a workstation or a workstation is not being triggered by a mod, the time set for General Crafting &amp; Orders (default is 15m) will be passed.\xa0 Examples of general crafting include the CACO Retort, the [i]Create Item[/i] spell from Campfire, a placed vendor order with Honed Metal, or the Hunterborn [i]Scrimshaw[/i].\xa0 This method is less intrusive, does not require specific mod detection and therefore gives wider compatibility with other mods.\xa0 It is recommended this value be kept relatively low because this catch-all category may cover a number of scenarios, as previously described.\xa0 It also relies on the mod-added item to correctly report its item type.\xa0 Mod-added Items that report as Type 0 (\"unknown\") will generally be ignored by Time Flies, so if a crafted item isn't passing time, this is the most likely reason.\n<br />\n<br />[list][*]3.7.0 Adds Skinning time.\xa0 It is disabled by default and recommended to leave off if you are using Hunterborn field dressing or Hunting in Skyrim skinning.\xa0 When enabled, the set time will advance for each skin, raw food item, ingredient and poison looted from a fallen animal or creature.\xa0 Ingredients and poisons will use set harvesting time.\xa0 Time will advance for all items looted (one notification for the total time passed) on close of the looting menu. If using the Take All button, a 3s delay will pass before advancing the time - this gives the script time to calc all the looted items. Note: Doing multiple Loot All actions in fast succession may result in time not passing or time passing when it should not.\xa0\n<br />[*]3.6.0 Transition duration added to MCM. When enabled for crafting that takes longer than one hour, transitions show a fade-to-black over set duration time. Default duration is 10s, but shows initially as 0 if upgrading from previous versions until changed.\n<br />[*]3.5.0 Adds Mining time. The default is set to 10 minutes per ore gained and uses the random time multiplier (if enabled), but if you are upgrading from earlier versions to 3.5.0 it will show as 0 initially until it is changed. Setting is in the Activities tab of the MCM.\n<br />[*]3.4.5 Adds transitions when crafting items that advance time by an hour or more (screen will fade to black briefly before returning at the advanced \n<br />[*]time). Disabled by default - enable and set threshold on the General tab of the MCM. \n<br />[*]3.4.0 Complete Alchemy and Cooking Overhaul (CACO) compatibility added.\n<br />[*]3.3.0 Adds Harvesting time. The default is set to 10 minutes and uses the random time multiplier (if enabled), but if you are upgrading from 3.2.2 to 3.3.0 it will show as 0 initially until it is changed.\xa0 You can also select Load Defaults to set that default.\xa0 The setting is located in the Other Actions section of the Others tab. \n<br />[/list][/spoiler]\n<br />\n<br />[b][size=4]What's new in version 2[/size][/b]\n<br />A \"framework\" has been implemented in version 2, which should make it easier for those who wants to add support for other mods into Time Flies by themselves. Code structure has been changed and I rather not spend time making a seamless update. So, it's NOT COMPATIBLE with version 1.x and you must make a clean save to update (read the update part). However, version 1.x should be good enough if you just need supports for Campfire or iNeed. Read [url=http://www.nexusmods.com/skyrim/articles/50751]this guide[/url] if you're interested in making support for other mods.\n<br />\n<br />[b][size=4]Requirements[/size][/b]\n<br />[url=http://skse.silverlock.org/]SKSE[/url] and [url=https://www.nexusmods.com/skyrimspecialedition/mods/12604/]SkyUI[/url]. And [url=https://www.nexusmods.com/skyrimspecialedition/mods/13956/]FISSES[/url] if you want to save or load your own settings. Supported mods are NOT REQUIRED to run this mod. However, if you install any supported mod afterwards, you need to reinitialize Time Flies in MCM to make it recognize them. [url=https://www.nexusmods.com/skyrimspecialedition/mods/266]USSEP [/url]is a soft requirement, but it fixes a number of item types that will prevent strange time behavior, so is recommended.\n<br />\n<br />[b][size=4]Compatibility\n<br />[/size][/b]Mod support has been added for: Hearthfire, Anniversary Edition fishing, Hearthfire Extended,\xa0\x42\x61sic Camp Gear, Campfire (Frostfall), Campsite, iNeed, Last Seed, SunHelm, Skyrim Fishing, Hunting in Skyrim and Wounds.\n<br />\n<br />Time Flies is compatible with Complete Alchemy and Cooking Overhaul (CACO), Complete Crafting Overhaul Remastered (CCOR), Dynamic Timescale, Honed Metal, Hunterborn, Skyrim Souls, and Spell Research.\n<br />\n<br />Incompatible with other time advancing mods such as Living Takes Time and Time Passes.\xa0 If you have previously used those mods and are adding Time Flies mid-game, be sure to uninstall those mods and clean the save before installing Time Flies. \n<br />\n<br />Any mod that radically changes vanilla systems for menus, crafting, training, learning spells, inventory or containers could potentially have a compatibility issue with Time Flies (though they could work together just fine depending on how they are implemented). \n<br />\n<br />Any mod that floods additem or removeitem wth actual or phantom items could potentially present a compatibility issue.\xa0 Best practice is to always test both mods in game and see how they behave. \n<br />\n<br />Remember that the Time Flies Pause Hotkey can be toggled in certain instances to temporarily pause passing time for a mod with compatibility issues.\n<br />\n<br />[b][size=4]Known Issues[/size][/b]\n<br />There is a small chance that unnecessary time will pass when separating backpack or removing bed roll from tent. Currently I rely on item removing event to determine whether player is separating backpack or removing bed roll. However, when \"crafting\" those items, item removing event doesn't always triggered before item adding event. Hence, there is no guarantee that Time Flies will work properly in these situations. Set a pause hotkey if you need.\n<br />\n<br />[b][size=4]Installation\n<br />[/size][/b]Install with your mod manager and sort with LOOT.\n<br />If the 2 FISSES scripts that come with Time Flies conflict with FISSES or another mod, allow those mod(s) to overwrite Time Flies.\n<br />\n<br />[b][size=4]Update[/size][/b]\n<br />Updating a major version number of Time Flies mid-game is not a typical install of the latest version and uninstalling the old.\xa0 Please carefully follow all the steps below, or you may experience strange time behavior:\n<br />\n<br />1. Do a full clean save (not a quick save) of your current game - this will be your existing TF save\n<br />2. In the General tab for Time Flies, [b]Save [/b]your current settings.\n<br />3. Exit the game and Install the new major version (you can disable or uninstall the old version)\n<br />4. Start the game, and in the General tab for Time Flies, [u][b]Reinitialize Time Flies[/b][/u] [b](Important!)[/b]\n<br />5. Exit the MCM\n<br />6. Once the Upgrade notification appears, re-enter the MCM\n<br />7. In the General tab, [b]Load [/b]your saved settings\n<br />8. Adjust settings for any newly supported mods\n<br />9. (optional) Save your new settings in the General tab.\n<br />10. Exit the MCM and Save your game - this will be the first save using the new version\n<br />\n<br />[b]NOTE: [/b]Once you upgrade and save the game, you will not be able to return to the old version in future saves.\xa0 If you want to return to the old version, you will need to reinstall the old version, return to your old save, then reinitialize TF in game. \n<br />\n<br />[b][size=4]Uninstallation[/size][/b]\n<br />Make sure to disable Time Flies and clear the pause hotkey before uninstallation.\n<br />\n<br />[b][size=4]Credits[/size][/b]\n<br />Credit to dfxyz1 who did Hearthfire, Campfire/Frostfall, iNeed and other enhancements to Akezhar's Living Takes Time to create Time Flies\n<br />All credits to Akezhar, the original Living Takes Time's author. We have all really enjoyed his mod for a long time.\n<br />And to those who created mod-compatible versions of Living Takes Time (dragonsong, DrPastah, mlheur and anyone not mentioned). Haven't I tried those mods and read their source code, I won't realize that it's not difficult to customized Living Takes Time and then make this mod.\n<br />Special thanks to [url=https://github.com/sirtaj]sirtaj[/url] for his or her vim-papyrus plugin. I definitely won't write any code with other editor."
